{{ define "main" }}
<div class="cv-full-wrapper">
  <div class="cv-topbar">
    <div class="cv-title">Curriculum Vitae</div>
    <div class="cv-actions">
      <a class="cv-button" href="{{ "/uploads/resume.pdf" | relURL }}" target="_blank" rel="noopener">
        Download PDF
      </a>
    </div>
  </div>
  <iframe
    src="{{ "/uploads/resume.pdf" | relURL }}"
    title="James R. Beattie CV"
    class="cv-iframe"
  ></iframe>
  <p class="cv-download-fallback">
    If the document does not display, <a href="{{ "/uploads/resume.pdf" | relURL }}" target="_blank" rel="noopener">download the CV</a>.
  </p>
</div>

<style>
.cv-full-wrapper {
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  width: 100vw;
  min-height: 100vh;
  padding: 0;
  overflow: hidden;
  background: #0b1220;
}

.cv-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.5rem;
  background: rgba(17, 24, 39, 0.92);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  position: sticky;
  top: 0;
  z-index: 5;
}

.cv-title {
  color: #e5e7eb;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.cv-actions {
  display: flex;
  gap: 0.5rem;
}

.cv-button {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.45rem 0.9rem;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(77, 171, 247, 0.25), rgba(77, 171, 247, 0.18));
  color: #eaf5ff;
  text-decoration: none;
  font-weight: 600;
  border: 1px solid rgba(77, 171, 247, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.cv-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(77, 171, 247, 0.2);
  border-color: rgba(77, 171, 247, 0.6);
}

.cv-iframe {
  display: block;
  width: 100vw;
  height: calc(100vh - 140px);
  border: none;
  background: #111827;
  /* Invert the embedded PDF to mimic a dark mode view. */
  filter: invert(0.92) hue-rotate(180deg);
}

.cv-download-fallback {
  text-align: center;
  margin: 1rem 0 0;
  color: rgba(255, 255, 255, 0.7);
}

.cv-download-fallback a {
  color: #4dabf7;
  text-decoration: underline;
}

@media (max-width: 768px) {
  .cv-topbar {
    padding: 0.75rem 1rem;
  }
  .cv-iframe {
    height: calc(100vh - 120px);
  }
}
</style>
{{ end }}
