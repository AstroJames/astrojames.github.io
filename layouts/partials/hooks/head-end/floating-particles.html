{{/* Floating Particles Around Header */}}
<style>
#particle-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  pointer-events: none;
  transition: all 0.3s ease-out;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
  animation: twinkle 2s ease-in-out infinite;
}

.particle.magnetic {
  background: rgba(255, 0, 0, 0.9);
  box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
  transform: scale(1.2);
  animation: twinkle-red 1.5s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { 
    opacity: 0.3;
    box-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
    transform: scale(0.8);
  }
  50% { 
    opacity: 1;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    transform: scale(1.2);
  }
}

@keyframes twinkle-red {
  0%, 100% { 
    opacity: 0.4;
    box-shadow: 0 0 4px rgba(255, 0, 0, 0.4);
    transform: scale(1.0);
  }
  50% { 
    opacity: 1;
    box-shadow: 0 0 16px rgba(255, 0, 0, 1.0);
    transform: scale(1.4);
  }
}

/* Make sure header has proper z-index */
header, .navbar {
  position: relative;
  z-index: 1000;
}
</style>

<div id="particle-container"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const particleContainer = document.getElementById('particle-container');
  const header = document.querySelector('header') || document.querySelector('.navbar');
  const particles = [];
  const numParticles = 75;
  
  // Create particles
  for (let i = 0; i < numParticles; i++) {
    createParticle();
  }
  
  function createParticle() {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    // Get actual header height and text areas to avoid
    const headerHeight = header ? header.offsetHeight : 80;
    const navLinks = header ? header.querySelectorAll('a, .navbar-brand, .nav-link') : [];
    
    let x, y, attempts = 0;
    let validPosition = false;
    
    // Try to find a position that doesn't overlap with text
    while (!validPosition && attempts < 50) {
      x = Math.random() * window.innerWidth;
      y = Math.random() * headerHeight;
      
      validPosition = true;
      
      // Check if this position overlaps with any navigation text
      for (let link of navLinks) {
        const rect = link.getBoundingClientRect();
        const buffer = 15; // Reduced buffer around text
        
        if (x >= rect.left - buffer && x <= rect.right + buffer &&
            y >= rect.top - buffer && y <= rect.bottom + buffer) {
          validPosition = false;
          break;
        }
      }
      
      attempts++;
    }
    
    // If we can't find a good position, place it randomly and let it move naturally
    if (!validPosition) {
      x = Math.random() * window.innerWidth;
      y = Math.random() * headerHeight;
    }
    
    particle.style.left = x + 'px';
    particle.style.top = y + 'px';
    
    // Store original position and current velocity (slower initial movement)
    particle.originalX = x;
    particle.originalY = y;
    particle.currentX = x;
    particle.currentY = y;
    particle.vx = (Math.random() - 0.5) * 0.2; // Reduced from 0.5 to 0.2
    particle.vy = (Math.random() - 0.5) * 0.2; // Reduced from 0.5 to 0.2
    
    // Randomize the twinkling animation timing
    const randomDelay = Math.random() * 2; // 0-2 second delay
    const randomDuration = 1.5 + Math.random() * 1; // 1.5-2.5 second duration
    particle.style.animationDelay = randomDelay + 's';
    particle.style.animationDuration = randomDuration + 's';
    
    particleContainer.appendChild(particle);
    particles.push(particle);
  }
  
  let mouseX = 0;
  let mouseY = 0;
  let isMouseInHeader = false;
  
  // Mouse tracking
  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  
  // Header mouse events
  if (header) {
    header.addEventListener('mouseenter', function() {
      isMouseInHeader = true;
      particles.forEach(particle => {
        particle.classList.add('magnetic');
      });
    });
    
    header.addEventListener('mouseleave', function() {
      isMouseInHeader = false;
      particles.forEach(particle => {
        particle.classList.remove('magnetic');
      });
    });
  }
  
  // Get magnetic field line paths (now extended across full site)
  function getMagneticFieldPaths() {
    const headerHeight = header ? header.offsetHeight : 80;
    const centerY = headerHeight / 2;
    
    // Define the two field lines (same as in header-field-lines.html)
    const topLine = {
      y: centerY - 15,
      amplitude: 15,
      direction: -1
    };
    
    const bottomLine = {
      y: centerY + 15,
      amplitude: 15,
      direction: 1
    };
    
    return [topLine, bottomLine];
  }
  
  // Calculate field line Y position at given X (now extends full width)
  function getFieldLineY(x, fieldLine) {
    const screenWidth = window.innerWidth;
    const startX = 0;
    const endX = screenWidth;
    const midX = screenWidth * 0.5;
    
    // Normalize x to 0-1 range
    const t = x / screenWidth;
    
    // For our simple curve, approximate with sine wave
    const curveOffset = Math.sin(t * Math.PI) * fieldLine.amplitude * fieldLine.direction * 0.5;
    return fieldLine.y + curveOffset;
  }
  
  // Find closest field line to particle
  function getClosestFieldLine(x, y) {
    const fieldLines = getMagneticFieldPaths();
    let closest = fieldLines[0];
    let minDistance = Math.abs(y - getFieldLineY(x, fieldLines[0]));
    
    for (let line of fieldLines) {
      const lineY = getFieldLineY(x, line);
      const distance = Math.abs(y - lineY);
      if (distance < minDistance) {
        minDistance = distance;
        closest = line;
      }
    }
    
    return { line: closest, distance: minDistance };
  }
  
  // Calculate repulsive forces between particles (Coulomb-like)
  function applyParticleRepulsion() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const p1 = particles[i];
        const p2 = particles[j];
        
        const dx = p1.currentX - p2.currentX;
        const dy = p1.currentY - p2.currentY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < 50 && distance > 0) { // Repulsion range
          const force = 0.5 / (distance * distance); // Inverse square law
          const fx = (dx / distance) * force;
          const fy = (dy / distance) * force;
          
          // Apply force to both particles
          p1.vx += fx;
          p1.vy += fy;
          p2.vx -= fx;
          p2.vy -= fy;
        }
      }
    }
  }
  
  // Animation loop
  function animateParticles() {
    // Apply particle-particle repulsion first
    applyParticleRepulsion();
    
    particles.forEach(particle => {
      if (isMouseInHeader) {
        // When mouse is in header, particles still gyrate but are attracted
        const dx = mouseX - particle.currentX;
        const dy = mouseY - particle.currentY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance > 30) {
          // Apply gentle magnetic force toward mouse
          const force = 0.003;
          particle.vx += dx * force;
          particle.vy += dy * force;
        }
        
        // But still constrain to gyration around field lines
        const { line, distance: fieldDistance } = getClosestFieldLine(particle.currentX, particle.currentY);
        const fieldLineY = getFieldLineY(particle.currentX, line);
        
        if (fieldDistance > 8) { // 8px radius from field line
          // Apply force toward the field line
          const fieldForce = (particle.currentY - fieldLineY) * -0.02;
          particle.vy += fieldForce;
        }
        
        // Gyration around field line
        if (!particle.gyrationAngle) particle.gyrationAngle = Math.random() * Math.PI * 2;
        particle.gyrationAngle += 0.15; // Gyration speed
        
        const gyrationRadius = 6;
        const targetY = fieldLineY + Math.sin(particle.gyrationAngle) * gyrationRadius;
        particle.vy += (targetY - particle.currentY) * 0.05;
        
      } else {
        // Normal gyration around field lines
        const { line, distance: fieldDistance } = getClosestFieldLine(particle.currentX, particle.currentY);
        const fieldLineY = getFieldLineY(particle.currentX, line);
        
        // Initialize gyration angle if not set
        if (!particle.gyrationAngle) {
          particle.gyrationAngle = Math.random() * Math.PI * 2;
        }
        
        // Gyration physics
        particle.gyrationAngle += 0.08; // Gyration frequency
        const gyrationRadius = 4 + Math.random() * 3; // 4-7px radius
        
        // Calculate target position on circular gyration
        const targetY = fieldLineY + Math.sin(particle.gyrationAngle) * gyrationRadius;
        
        // Apply forces to maintain gyration
        particle.vy += (targetY - particle.currentY) * 0.03;
        
        // Drift along field line (parallel motion)
        const driftSpeed = 0.3;
        particle.vx += (Math.random() - 0.5) * 0.02 + driftSpeed * (Math.random() > 0.5 ? 1 : -1) * 0.1;
        
        // Keep particle near field line
        if (fieldDistance > 12) {
          const pullForce = (particle.currentY - fieldLineY) * -0.05;
          particle.vy += pullForce;
        }
        
        // Damping
        particle.vx *= 0.95;
        particle.vy *= 0.95;
      }
      
      // Update position
      particle.currentX += particle.vx;
      particle.currentY += particle.vy;
      
      // Boundary constraints - keep within header with buffer from bottom
      const headerHeight = header ? header.offsetHeight : 80;
      const bottomBuffer = 8; // 8px buffer from bottom
      const sideBuffer = 5; // 5px buffer from sides
      
      particle.currentX = Math.max(sideBuffer, Math.min(window.innerWidth - sideBuffer, particle.currentX));
      particle.currentY = Math.max(5, Math.min(headerHeight - bottomBuffer, particle.currentY));
      
      // If particle hits boundaries, reverse velocity to bounce
      if (particle.currentX <= sideBuffer || particle.currentX >= window.innerWidth - sideBuffer) {
        particle.vx *= -0.3; // Reverse and dampen
      }
      if (particle.currentY <= 5 || particle.currentY >= headerHeight - bottomBuffer) {
        particle.vy *= -0.3; // Reverse and dampen
      }
      
      // Apply position
      particle.style.left = particle.currentX + 'px';
      particle.style.top = particle.currentY + 'px';
    });
    
    requestAnimationFrame(animateParticles);
  }
  
  // Start animation
  animateParticles();
  
  // Handle window resize
  window.addEventListener('resize', function() {
    const headerHeight = header ? header.offsetHeight : 80;
    particles.forEach((particle, index) => {
      particle.originalX = Math.random() * window.innerWidth;
      particle.originalY = Math.random() * headerHeight;
      particle.currentX = particle.originalX;
      particle.currentY = particle.originalY;
    });
  });
});
</script>
