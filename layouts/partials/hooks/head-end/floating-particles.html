{{/* Floating Particles Around Header */}}
<style>
#particle-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--particle-height, 80px);
  contain: layout style paint;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  pointer-events: none;
  left: 0;
  top: 0;
  will-change: transform;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
  animation: twinkle 2s ease-in-out infinite;
}

.particle.magnetic {
  background: var(--site-accent);
  box-shadow: 0 0 8px rgb(var(--color-primary-300) / 0.8);

  animation: twinkle-accent 1.5s ease-in-out infinite;
}

.photon {
  position: absolute;
  left: 0;
  top: 0;
  width: 2px;
  height: 2px;
  background: var(--site-link-hover);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 4px rgb(var(--color-primary-300) / 0.8);
  animation: photon-fade 0.6s ease-out forwards;
}

@keyframes photon-fade { from { opacity: 1; } to { opacity: 0; } }
@keyframes twinkle { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@keyframes twinkle-accent { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  #particle-container { display: none; }
}

/* Make sure header has proper z-index */
header, .navbar {
  position: relative;
  z-index: 1000;
}

@media (hover: none) and (pointer: coarse) {
  #particle-container {
    display: none !important;
  }
}
</style>

<div id="particle-container" aria-hidden="true"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const isTouchPrimary = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (isTouchPrimary) return;

  const particleContainer = document.getElementById('particle-container');
  if (!particleContainer) return;
  const header = document.querySelector('header') || document.querySelector('.navbar');
  if (!header) return;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let headerHeight = header.offsetHeight;
  let headerWidth = window.innerWidth;
  const navRects = [...header.querySelectorAll('a')].map(link => link.getBoundingClientRect());
  const fieldLines = [{ y: 0, direction: -1 }, { y: 0, direction: 1 }];
  const particles = [];
  const photons = [];
  const numParticles = 75;
  
  function measureHeader() {
    const previousWidth = headerWidth;
    headerWidth = window.innerWidth;
    headerHeight = header.offsetHeight;
    const centerY = headerHeight / 2;
    fieldLines[0].y = (centerY - 15) / 2;
    fieldLines[1].y = ((centerY + 15) + headerHeight) / 2;
    particleContainer.style.setProperty('--particle-height', headerHeight + 'px');
    particles.forEach(particle => {
      particle.currentX *= headerWidth / previousWidth;
      particle.currentY = Math.min(particle.currentY, headerHeight - 8);
    });
  }
  measureHeader();
  new ResizeObserver(measureHeader).observe(header);

  // Create particles
  for (let i = 0; i < numParticles; i++) {
    createParticle();
  }
  
  function createParticle() {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    // Get actual header height and text areas to avoid
    
    let x, y, attempts = 0;
    let validPosition = false;
    
    // Try to find a position that doesn't overlap with text
    while (!validPosition && attempts < 50) {
      x = Math.random() * window.innerWidth;
      y = Math.random() * headerHeight;
      
      validPosition = true;
      
      // Check if this position overlaps with any navigation text
      for (const rect of navRects) {
        const buffer = 15; // Reduced buffer around text
        
        if (x >= rect.left - buffer && x <= rect.right + buffer &&
            y >= rect.top - buffer && y <= rect.bottom + buffer) {
          validPosition = false;
          break;
        }
      }
      
      attempts++;
    }
    
    // If we can't find a good position, place it randomly and let it move naturally
    if (!validPosition) {
      x = Math.random() * window.innerWidth;
      y = Math.random() * headerHeight;
    }
    
    particle.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    
    // Store original position and current velocity (slower initial movement)
    particle.originalX = x;
    particle.originalY = y;
    particle.currentX = x;
    particle.currentY = y;
    particle.vx = (Math.random() - 0.5) * 0.2; // Reduced from 0.5 to 0.2
    particle.vy = (Math.random() - 0.5) * 0.2; // Reduced from 0.5 to 0.2
    
    // Initialize drift properties
    particle.driftDirection = Math.random() > 0.5 ? 1 : -1; // Random initial drift direction
    particle.gyrationRadius = 4 + Math.random() * 3;
    particle.gyrationAngle = Math.random() * Math.PI * 2;
    particle.driftSpeed = 0.135 + Math.random() * 0.18; // 0.135-0.315 drift speed (10% slower)
    
    // Randomize the twinkling animation timing
    const randomDelay = Math.random() * 2; // 0-2 second delay
    const randomDuration = 1.5 + Math.random() * 1; // 1.5-2.5 second duration
    particle.style.animationDelay = randomDelay + 's';
    particle.style.animationDuration = randomDuration + 's';
    
    particleContainer.appendChild(particle);
    particles.push(particle);
  }
  
  let mouseX = 0;
  let mouseY = 0;
  let isMouseInHeader = false;
  
  // Mouse tracking
  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  
  // Header mouse events
  if (header) {
    header.addEventListener('mouseenter', function() {
      isMouseInHeader = true;
      particles.forEach(particle => {
        particle.classList.add('magnetic');
      });
    });
    
    header.addEventListener('mouseleave', function() {
      isMouseInHeader = false;
      particles.forEach(particle => {
        particle.classList.remove('magnetic');
      });
    });
  }
  
  // Calculate field line Y position at given X (straight or curved)
  function getFieldLineY(x, fieldLine) {
    // Check if field lines are distorted by name hover
    if (window.magneticFieldState && (window.magneticFieldState.isDistorted || window.magneticFieldState.isRelaxing || window.magneticFieldState.waveActive)) {
      return window.magneticFieldState.getFieldLineY(x, fieldLine.y);
    }
    
    // Simple straight field lines - Y position is constant
    return fieldLine.y;
  }
  
  // Find closest field line to particle
  function getClosestFieldLine(x, y) {
    let closest = fieldLines[0];
    let minDistance = Math.abs(y - getFieldLineY(x, fieldLines[0]));
    
    for (let line of fieldLines) {
      const lineY = getFieldLineY(x, line);
      const distance = Math.abs(y - lineY);
      if (distance < minDistance) {
        minDistance = distance;
        closest = line;
      }
    }
    
    return { line: closest, distance: minDistance };
  }
  
  // Create photon emission when particle loses energy
  function emitPhoton(x, y, vx, vy, energyLoss, step) {
    if (energyLoss < 0.01) return; // Original threshold for emission
    if (photons.length >= 40 || Math.random() > 0.1 * step) return; // Only 10% chance of emission
    
    const photon = document.createElement('div');
    photon.className = 'photon';
    
    // Position photon at particle location
    photon.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    
    // Store photon properties
    photon.currentX = x;
    photon.currentY = y;
    
    // Photon velocity proportional to energy loss (like synchrotron radiation)
    const photonSpeed = energyLoss * 50; // Scale factor for visibility
    const angle = Math.atan2(vy, vx) + (Math.random() - 0.5) * 0.5; // Slight random deviation
    
    photon.vx = Math.cos(angle) * photonSpeed;
    photon.vy = Math.sin(angle) * photonSpeed;
    
    particleContainer.appendChild(photon);
    photons.push(photon);
    
    // Remove photon after shorter animation
    setTimeout(() => {
      if (photon.parentNode) {
        photon.parentNode.removeChild(photon);
      }
      const index = photons.indexOf(photon);
      if (index > -1) photons.splice(index, 1);
    }, 600); // Shorter lifetime to reduce active photons
  }
  
  // Update photon positions
  function updatePhotons(step) {
    photons.forEach(photon => {
      photon.currentX += photon.vx * step;
      photon.currentY += photon.vy * step;
      
      photon.style.transform = `translate3d(${photon.currentX}px, ${photon.currentY}px, 0)`;
      
      // Photons travel at constant speed (no damping)
    });
  }
  
  // Calculate repulsive forces between particles (Coulomb-like)
  function applyParticleRepulsion(step) {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const p1 = particles[i];
        const p2 = particles[j];
        
        const dx = p1.currentX - p2.currentX;
        const dy = p1.currentY - p2.currentY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < 50 && distance > 0) { // Repulsion range
          const force = 2.0 / Math.max(16, distance * distance); // Stronger inverse square law
          const fx = (dx / distance) * force;
          const fy = (dy / distance) * force;
          
          // Apply force to both particles
          p1.vx += (fx) * step;
          p1.vy += (fy) * step;
          p2.vx -= (fx) * step;
          p2.vy -= (fy) * step;
        }
      }
    }
  }
  
  // Animation loop
  let animationId = null;
  let lastTimestamp = null;
  function animateParticles(timestamp) {
    animationId = null;
    // Normalize to the original 60 Hz simulation; never catch up a hidden tab.
    const step = lastTimestamp === null ? 1 : Math.min(2, (timestamp - lastTimestamp) / (1000 / 60));
    lastTimestamp = timestamp;
    // Apply particle-particle repulsion first
    applyParticleRepulsion(step);
    
    // Update photons
    updatePhotons(step);
    
    particles.forEach(particle => {
      if (isMouseInHeader) {
        // When mouse is in header, particles still gyrate but are attracted
        const dx = mouseX - particle.currentX;
        const dy = mouseY - particle.currentY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance > 30) {
          // Apply stronger magnetic force toward mouse
          const force = 0.008;
          particle.vx += (dx * force) * step;
          particle.vy += (dy * force) * step;
        }
        
        // But still constrain to gyration around field lines
        const { line, distance: fieldDistance } = getClosestFieldLine(particle.currentX, particle.currentY);
        const fieldLineY = getFieldLineY(particle.currentX, line);
        
        if (fieldDistance > 8) { // 8px radius from field line
          // Apply force toward the field line
          const fieldForce = (particle.currentY - fieldLineY) * -0.02;
          particle.vy += (fieldForce) * step;
        }
        
        // Gyration around field line
        if (!particle.gyrationAngle) particle.gyrationAngle = Math.random() * Math.PI * 2;
        particle.gyrationAngle += 0.15 * step; // Gyration speed
        
        const gyrationRadius = 6;
        const targetY = fieldLineY + Math.sin(particle.gyrationAngle) * gyrationRadius;
        particle.vy += ((targetY - particle.currentY) * 0.05) * step;
        
        // Calculate energy before damping
        const energyBefore = particle.vx * particle.vx + particle.vy * particle.vy;
        
        // Stronger damping when tracking cursor
        particle.vx *= Math.pow(0.85, step); // Increased damping from 0.92
        particle.vy *= Math.pow(0.85, step);
        
        // Calculate energy loss and emit photons (synchrotron radiation)
        const energyAfter = particle.vx * particle.vx + particle.vy * particle.vy;
        const energyLoss = energyBefore - energyAfter;
        
        if (energyLoss > 0.02) { // Higher threshold for photon emission
          emitPhoton(particle.currentX, particle.currentY, particle.vx, particle.vy, energyLoss, step);
        }
        
      } else {
        // Normal gyration around field lines
        const { line, distance: fieldDistance } = getClosestFieldLine(particle.currentX, particle.currentY);
        const fieldLineY = getFieldLineY(particle.currentX, line);
        
        // Initialize gyration angle if not set
        if (!particle.gyrationAngle) {
          particle.gyrationAngle = Math.random() * Math.PI * 2;
        }
        
        // Gyration physics
        particle.gyrationAngle += 0.08 * step; // Gyration frequency
        const gyrationRadius = particle.gyrationRadius; // 4-7px radius
        
        // Calculate target position on circular gyration
        const targetY = fieldLineY + Math.sin(particle.gyrationAngle) * gyrationRadius;
        
        // Apply forces to maintain gyration
        particle.vy += ((targetY - particle.currentY) * 0.03) * step;
        
        // Drift along field line (parallel motion) with boundary reflection
        particle.vx += (particle.driftDirection * particle.driftSpeed) * step;
        
        // Keep particle near field line
        if (fieldDistance > 12) {
          const pullForce = (particle.currentY - fieldLineY) * -0.05;
          particle.vy += (pullForce) * step;
        }
        
        // Damping (normal when not tracking cursor)
        particle.vx *= Math.pow(0.95, step);
        particle.vy *= Math.pow(0.95, step);
      }
      
      // Update position
      particle.currentX += particle.vx * step;
      particle.currentY += particle.vy * step;
      
      // Boundary constraints - keep within header with buffer from bottom
      const bottomBuffer = 8; // 8px buffer from bottom
      const sideBuffer = 5; // 5px buffer from sides
      
      // Check for boundary collisions and reflect drift direction
      if (particle.currentX <= sideBuffer && particle.driftDirection < 0) {
        particle.driftDirection = 1; // Reverse drift direction when hitting left boundary
        particle.vx = Math.abs(particle.vx); // Ensure velocity is positive
      }
      if (particle.currentX >= headerWidth - sideBuffer && particle.driftDirection > 0) {
        particle.driftDirection = -1; // Reverse drift direction when hitting right boundary
        particle.vx = -Math.abs(particle.vx); // Ensure velocity is negative
      }
      
      // Apply boundary constraints
      particle.currentX = Math.max(sideBuffer, Math.min(headerWidth - sideBuffer, particle.currentX));
      particle.currentY = Math.max(5, Math.min(headerHeight - bottomBuffer, particle.currentY));
      
      // Vertical boundary bouncing (for gyration motion)
      if (particle.currentY <= 5 || particle.currentY >= headerHeight - bottomBuffer) {
        particle.vy *= -0.3; // Reverse and dampen vertical velocity
      }
      
      // Apply position
      particle.style.transform = `translate3d(${particle.currentX}px, ${particle.currentY}px, 0)`;
    });
    
    animationId = requestAnimationFrame(animateParticles);
  }
  
  function updateMotion() {
    if (animationId !== null) cancelAnimationFrame(animationId);
    animationId = null;
    lastTimestamp = null;
    particleContainer.hidden = reducedMotion.matches;
    if (!document.hidden && !reducedMotion.matches) animationId = requestAnimationFrame(animateParticles);
  }
  document.addEventListener('visibilitychange', updateMotion);
  reducedMotion.addEventListener('change', updateMotion);
  updateMotion();
});
</script>
