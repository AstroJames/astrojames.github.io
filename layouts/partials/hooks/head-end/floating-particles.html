{{/* Floating Particles Around Header */}}
<style>
#particle-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  pointer-events: none;
  transition: all 0.3s ease-out;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
}

.particle.magnetic {
  background: rgba(255, 0, 0, 0.9);
  box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
  transform: scale(1.2);
}

/* Make sure header has proper z-index */
header, .navbar {
  position: relative;
  z-index: 1000;
}
</style>

<div id="particle-container"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const particleContainer = document.getElementById('particle-container');
  const header = document.querySelector('header') || document.querySelector('.navbar');
  const particles = [];
  const numParticles = 50;
  
  // Create particles
  for (let i = 0; i < numParticles; i++) {
    createParticle();
  }
  
  function createParticle() {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    // Get actual header height and text areas to avoid
    const headerHeight = header ? header.offsetHeight : 80;
    const navLinks = header ? header.querySelectorAll('a, .navbar-brand, .nav-link') : [];
    
    let x, y, attempts = 0;
    let validPosition = false;
    
    // Try to find a position that doesn't overlap with text
    while (!validPosition && attempts < 50) {
      x = Math.random() * window.innerWidth;
      y = Math.random() * headerHeight;
      
      validPosition = true;
      
      // Check if this position overlaps with any navigation text
      for (let link of navLinks) {
        const rect = link.getBoundingClientRect();
        const buffer = 30; // 30px buffer around text
        
        if (x >= rect.left - buffer && x <= rect.right + buffer &&
            y >= rect.top - buffer && y <= rect.bottom + buffer) {
          validPosition = false;
          break;
        }
      }
      
      attempts++;
    }
    
    // If we can't find a good position, place it in safe zones (edges)
    if (!validPosition) {
      if (Math.random() > 0.5) {
        x = Math.random() * 100; // Left edge
      } else {
        x = window.innerWidth - Math.random() * 100; // Right edge
      }
      y = Math.random() * headerHeight;
    }
    
    particle.style.left = x + 'px';
    particle.style.top = y + 'px';
    
    // Store original position and current velocity (slower initial movement)
    particle.originalX = x;
    particle.originalY = y;
    particle.currentX = x;
    particle.currentY = y;
    particle.vx = (Math.random() - 0.5) * 0.2; // Reduced from 0.5 to 0.2
    particle.vy = (Math.random() - 0.5) * 0.2; // Reduced from 0.5 to 0.2
    
    particleContainer.appendChild(particle);
    particles.push(particle);
  }
  
  let mouseX = 0;
  let mouseY = 0;
  let isMouseInHeader = false;
  
  // Mouse tracking
  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  
  // Header mouse events
  if (header) {
    header.addEventListener('mouseenter', function() {
      isMouseInHeader = true;
      particles.forEach(particle => {
        particle.classList.add('magnetic');
      });
    });
    
    header.addEventListener('mouseleave', function() {
      isMouseInHeader = false;
      particles.forEach(particle => {
        particle.classList.remove('magnetic');
      });
    });
  }
  
  // Animation loop
  function animateParticles() {
    particles.forEach(particle => {
      if (isMouseInHeader) {
        // Converge toward mouse
        const dx = mouseX - particle.currentX;
        const dy = mouseY - particle.currentY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance > 5) {
          // Apply magnetic force (reduced for slower convergence)
          const force = 0.008; // Reduced from 0.02 to 0.008
          particle.vx += dx * force;
          particle.vy += dy * force;
          
          // Damping (increased for slower movement)
          particle.vx *= 0.92; // Reduced from 0.95 to 0.92
          particle.vy *= 0.92;
        } else {
          // Orbit around mouse when very close
          const angle = Math.atan2(dy, dx) + 0.1;
          const radius = 20;
          particle.currentX = mouseX + Math.cos(angle) * radius;
          particle.currentY = mouseY + Math.sin(angle) * radius;
        }
      } else {
        // Return to floating behavior with more random motion
        const dx = particle.originalX - particle.currentX;
        const dy = particle.originalY - particle.currentY;
        
        // Apply gentle force back to original position (reduced influence)
        particle.vx += dx * 0.0002; // Further reduced
        particle.vy += dy * 0.0002;
        
        // Add stronger random floating motion
        particle.vx += (Math.random() - 0.5) * 0.04; // Increased from 0.01 to 0.04
        particle.vy += (Math.random() - 0.5) * 0.04;
        
        // Less damping for more lively movement
        particle.vx *= 0.98; // Increased from 0.96 to 0.98
        particle.vy *= 0.98;
      }
      
      // Update position
      particle.currentX += particle.vx;
      particle.currentY += particle.vy;
      
      // Boundary constraints - keep within header with buffer from bottom
      const headerHeight = header ? header.offsetHeight : 80;
      const bottomBuffer = 8; // 8px buffer from bottom
      const sideBuffer = 5; // 5px buffer from sides
      
      particle.currentX = Math.max(sideBuffer, Math.min(window.innerWidth - sideBuffer, particle.currentX));
      particle.currentY = Math.max(5, Math.min(headerHeight - bottomBuffer, particle.currentY));
      
      // If particle hits boundaries, reverse velocity to bounce
      if (particle.currentX <= sideBuffer || particle.currentX >= window.innerWidth - sideBuffer) {
        particle.vx *= -0.3; // Reverse and dampen
      }
      if (particle.currentY <= 5 || particle.currentY >= headerHeight - bottomBuffer) {
        particle.vy *= -0.3; // Reverse and dampen
      }
      
      // Apply position
      particle.style.left = particle.currentX + 'px';
      particle.style.top = particle.currentY + 'px';
    });
    
    requestAnimationFrame(animateParticles);
  }
  
  // Start animation
  animateParticles();
  
  // Handle window resize
  window.addEventListener('resize', function() {
    const headerHeight = header ? header.offsetHeight : 80;
    particles.forEach((particle, index) => {
      particle.originalX = Math.random() * window.innerWidth;
      particle.originalY = Math.random() * headerHeight;
      particle.currentX = particle.originalX;
      particle.currentY = particle.originalY;
    });
  });
});
</script>
