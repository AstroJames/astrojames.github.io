{{/* NEW SIMPLE APPROACH: Just scroll the entire content */}}
<style>
section[id="news"] {
  position: relative;
  overflow: hidden;
  height: 200px; /* Fixed height to show one item */
  border: 2px solid blue; /* Debug border */
}

section[id="news"]::before {
  content: "SIMPLE CAROUSEL";
  display: block;
  background: lightblue;
  padding: 5px;
  font-size: 12px;
}

/* Make the content scrollable */
section[id="news"] > div {
  transition: transform 0.5s ease;
}

/* Simple navigation buttons */
.simple-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  z-index: 100;
}

.simple-prev {
  left: 10px;
}

.simple-next {
  right: 10px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('=== NEW SIMPLE APPROACH ===');
    
    const newsSection = document.querySelector('section[id="news"]');
    if (!newsSection) {
      console.log('No news section found');
      return;
    }
    
    console.log('Found news section, adding simple scroll navigation');
    
    // Just measure the height of each "news item" by looking at the content height
    const contentHeight = newsSection.scrollHeight;
    const visibleHeight = 200; // Our fixed height from CSS
    
    console.log(`Content height: ${contentHeight}px, Visible: ${visibleHeight}px`);
    
    if (contentHeight <= visibleHeight) {
      console.log('Content fits in one view, no carousel needed');
      return;
    }
    
    // Calculate how many "screens" we can scroll through
    const totalScreens = Math.ceil(contentHeight / visibleHeight);
    let currentScreen = 0;
    
    console.log(`Can scroll through ${totalScreens} screens`);
    
    function scrollToScreen(screenIndex) {
      const scrollPosition = screenIndex * visibleHeight;
      const firstChild = newsSection.firstElementChild;
      if (firstChild) {
        firstChild.style.transform = `translateY(-${scrollPosition}px)`;
        console.log(`Scrolled to screen ${screenIndex}, position: -${scrollPosition}px`);
      }
      currentScreen = screenIndex;
    }
    
    function nextScreen() {
      const next = (currentScreen + 1) % totalScreens;
      scrollToScreen(next);
    }
    
    function prevScreen() {
      const prev = (currentScreen - 1 + totalScreens) % totalScreens;
      scrollToScreen(prev);
    }
    
    // Add simple navigation buttons
    const nextBtn = document.createElement('button');
    nextBtn.innerHTML = '▼';
    nextBtn.className = 'simple-nav simple-next';
    nextBtn.onclick = nextScreen;
    
    const prevBtn = document.createElement('button');
    prevBtn.innerHTML = '▲';
    prevBtn.className = 'simple-nav simple-prev';
    prevBtn.onclick = prevScreen;
    
    newsSection.appendChild(nextBtn);
    newsSection.appendChild(prevBtn);
    
    console.log('Simple carousel ready!');
    
  }, 1000);
});
</script>
