{{/* Debug News Section - Carousel Disabled */}}
<style>
/* Just basic styling for debug */
section[id="news"] {
  border: 2px solid red;
  padding: 10px;
  margin: 10px 0;
}

section[id="news"]::before {
  content: "DEBUG: News section found";
  display: block;
  background: yellow;
  padding: 5px;
  font-weight: bold;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('=== SIMPLE DEBUG - NO CAROUSEL ===');
    
    const newsSection = document.querySelector('section[id="news"]');
    if (newsSection) {
      console.log('✅ Found news section');
      console.log('News section HTML:', newsSection.outerHTML);
    } else {
      console.log('❌ No news section found');
      
      // Check if there are any sections
      const allSections = document.querySelectorAll('section');
      console.log('All sections found:', allSections.length);
      allSections.forEach((section, i) => {
        console.log(`Section ${i}:`, section.id, section.className);
      });
    }
    
  }, 2000); // Wait longer to ensure everything is loaded
});
</script>
