{{/* FIXED APPROACH: Scroll between actual news items */}}
<style>
section[id="news"] {
  position: relative;
  overflow: hidden;
  height: 200px; /* Fixed height window */
  border: 2px solid purple;
  padding: 0;
  margin: 20px 0;
}

section[id="news"]::before {
  content: "ITEM-BASED CAROUSEL";
  display: block;
  background: lavender;
  padding: 5px;
  font-size: 12px;
}

/* Make the content scrollable */
section[id="news"] > div {
  transition: transform 0.5s ease;
}

/* Simple navigation buttons */
.simple-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  z-index: 100;
}

.simple-prev {
  left: 10px;
}

.simple-next {
  right: 10px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('=== NEW SIMPLE APPROACH ===');
    
    const newsSection = document.querySelector('section[id="news"]');
    if (!newsSection) {
      console.log('No news section found');
      return;
    }
    
    console.log('Found news section, adding simple scroll navigation');
    
    // Find individual news items to scroll between them
    const newsContainer = newsSection.querySelector('div, article, section');
    if (!newsContainer) {
      console.log('No container found');
      return;
    }
    
    // Get all child elements that look like news items
    const allChildren = Array.from(newsContainer.children);
    const newsItems = allChildren.filter(child => {
      const hasContent = child.textContent.trim().length > 20;
      const notScript = child.tagName !== 'SCRIPT';
      return hasContent && notScript;
    });
    
    console.log(`Found ${newsItems.length} potential news items`);
    
    if (newsItems.length === 0) {
      console.log('No news items found');
      return;
    }
    
    // Get the position of each news item
    const itemPositions = newsItems.map(item => item.offsetTop);
    console.log('Item positions:', itemPositions);
    
    let currentItemIndex = 0;
    
    function scrollToItem(itemIndex) {
      const position = itemPositions[itemIndex] || 0;
      const firstChild = newsSection.firstElementChild;
      if (firstChild) {
        firstChild.style.transform = `translateY(-${position}px)`;
        console.log(`Scrolled to item ${itemIndex}, position: -${position}px`);
      }
      currentItemIndex = itemIndex;
    }
    
    function nextItem() {
      const next = (currentItemIndex + 1) % newsItems.length;
      scrollToItem(next);
    }
    
    function prevItem() {
      const prev = (currentItemIndex - 1 + newsItems.length) % newsItems.length;
      scrollToItem(prev);
    }
    
    // Add simple navigation buttons
    const nextBtn = document.createElement('button');
    nextBtn.innerHTML = '▼';
    nextBtn.className = 'simple-nav simple-next';
    nextBtn.onclick = nextItem;
    
    const prevBtn = document.createElement('button');
    prevBtn.innerHTML = '▲';
    prevBtn.className = 'simple-nav simple-prev';
    prevBtn.onclick = prevItem;
    
    newsSection.appendChild(nextBtn);
    newsSection.appendChild(prevBtn);
    
    console.log('Simple carousel ready!');
    
  }, 1000);
});
</script>
