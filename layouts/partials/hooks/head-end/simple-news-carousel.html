{{/* FIXED APPROACH: Scroll between actual news items */}}
<style>
section[id="news"] {
  position: relative;
  overflow: hidden;
  height: 200px; /* Fixed height window */
  border: 2px solid purple;
  padding: 0;
  margin: 20px 0;
}

section[id="news"]::before {
  content: "ITEM-BASED CAROUSEL";
  display: block;
  background: lavender;
  padding: 5px;
  font-size: 12px;
}

/* Make the content scrollable */
section[id="news"] > div {
  transition: transform 0.5s ease;
}

/* Simple navigation buttons */
.simple-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  z-index: 100;
}

.simple-prev {
  left: 10px;
}

.simple-next {
  right: 10px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('=== NEW SIMPLE APPROACH ===');
    
    const newsSection = document.querySelector('section[id="news"]');
    if (!newsSection) {
      console.log('No news section found');
      return;
    }
    
    console.log('=== DETAILED DEBUGGING ===');
    console.log('News section HTML:', newsSection.outerHTML);
    console.log('News section children:', newsSection.children.length);
    
    // Log all direct children of news section
    Array.from(newsSection.children).forEach((child, i) => {
      console.log(`Direct child ${i}:`, {
        tag: child.tagName,
        classes: child.className,
        id: child.id,
        textLength: child.textContent.trim().length,
        textPreview: child.textContent.trim().substring(0, 100),
        element: child
      });
    });
    
    // Try to find ANY container with content
    let newsItems = [];
    
    // Method 1: Direct children of news section
    console.log('--- Method 1: Direct children ---');
    const directChildren = Array.from(newsSection.children).filter(child => {
      const hasText = child.textContent.trim().length > 10;
      const notScript = child.tagName !== 'SCRIPT';
      console.log(`Child: ${child.tagName}, hasText: ${hasText}, notScript: ${notScript}`);
      return hasText && notScript;
    });
    
    if (directChildren.length > 0) {
      console.log(`✅ Found ${directChildren.length} direct children with content`);
      newsItems = directChildren;
    } else {
      // Method 2: Look deeper
      console.log('--- Method 2: Looking deeper ---');
      const allDescendants = newsSection.querySelectorAll('*');
      console.log(`Found ${allDescendants.length} total descendants`);
      
      // Look for elements that seem like news articles
      const candidates = Array.from(allDescendants).filter(el => {
        const hasSignificantText = el.textContent.trim().length > 50;
        const hasLinks = el.querySelector('a[href]');
        const notContainer = !el.querySelector('article, .post, .card');
        
        console.log(`Candidate: ${el.tagName}.${el.className}, text: ${hasSignificantText}, links: ${!!hasLinks}, notContainer: ${notContainer}`);
        
        return hasSignificantText && hasLinks && notContainer;
      });
      
      if (candidates.length > 0) {
        console.log(`✅ Found ${candidates.length} candidate elements`);
        newsItems = candidates.slice(0, 8); // Limit to reasonable number
      }
    }
    
    console.log(`Final result: ${newsItems.length} items to work with`);
    
    if (newsItems.length === 0) {
      console.log('❌ No news items found with any method');
      console.log('🔍 Check the HTML structure above');
      return;
    }
    
    // Get the position of each news item
    const itemPositions = newsItems.map(item => item.offsetTop);
    console.log('Item positions:', itemPositions);
    
    let currentItemIndex = 0;
    
    function scrollToItem(itemIndex) {
      const position = itemPositions[itemIndex] || 0;
      const firstChild = newsSection.firstElementChild;
      if (firstChild) {
        firstChild.style.transform = `translateY(-${position}px)`;
        console.log(`Scrolled to item ${itemIndex}, position: -${position}px`);
      }
      currentItemIndex = itemIndex;
    }
    
    function nextItem() {
      const next = (currentItemIndex + 1) % newsItems.length;
      scrollToItem(next);
    }
    
    function prevItem() {
      const prev = (currentItemIndex - 1 + newsItems.length) % newsItems.length;
      scrollToItem(prev);
    }
    
    // Add simple navigation buttons
    const nextBtn = document.createElement('button');
    nextBtn.innerHTML = '▼';
    nextBtn.className = 'simple-nav simple-next';
    nextBtn.onclick = nextItem;
    
    const prevBtn = document.createElement('button');
    prevBtn.innerHTML = '▲';
    prevBtn.className = 'simple-nav simple-prev';
    prevBtn.onclick = prevItem;
    
    newsSection.appendChild(nextBtn);
    newsSection.appendChild(prevBtn);
    
    console.log('Simple carousel ready!');
    
  }, 1000);
});
</script>
