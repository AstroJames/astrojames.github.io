{{/* FIXED APPROACH: Scroll between actual news items */}}
<style>
section[id="news"] {
  position: relative;
  overflow: hidden;
  height: 300px; /* Increased height to show more content */
  border: 2px solid purple;
  padding: 10px; /* Add some padding */
  margin: 20px 0;
}

section[id="news"]::before {
  content: "ITEM-BASED CAROUSEL";
  display: block;
  background: lavender;
  padding: 5px;
  font-size: 12px;
}

/* Make the content scrollable */
section[id="news"] > div {
  transition: transform 0.5s ease;
}

/* Simple navigation buttons */
.simple-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  z-index: 100;
}

.simple-prev {
  left: 10px;
}

.simple-next {
  right: 10px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('=== NEW SIMPLE APPROACH ===');
    
    const newsSection = document.querySelector('section[id="news"]');
    if (!newsSection) {
      console.log('No news section found');
      return;
    }
    
    console.log('=== DETAILED DEBUGGING ===');
    console.log('News section HTML:', newsSection.outerHTML);
    console.log('News section children:', newsSection.children.length);
    
    // Log all direct children of news section
    Array.from(newsSection.children).forEach((child, i) => {
      console.log(`Direct child ${i}:`, {
        tag: child.tagName,
        classes: child.className,
        id: child.id,
        textLength: child.textContent.trim().length,
        textPreview: child.textContent.trim().substring(0, 100),
        element: child
      });
    });
    
    // Try to find ANY container with content
    let newsItems = [];
    
    // Look specifically for post/ directory links since each directory = news item
    console.log('--- Looking for /post/ directory links ---');
    
    // Find all links that point to /post/ directories
    const postLinks = newsSection.querySelectorAll('a[href*="/post/"]');
    console.log(`Found ${postLinks.length} links to /post/ directories`);
    
    let foundItems = [];
    
    postLinks.forEach((link, i) => {
      console.log(`Post link ${i}:`, link.href, link.textContent.trim().substring(0, 50));
      
      // Find the container that holds this entire news item
      // Start from the link and go up until we find a container with substantial content
      let container = link;
      let bestContainer = link;
      
      while (container && container !== newsSection) {
        container = container.parentElement;
        
        // Look for a container that:
        // 1. Has reasonable amount of content
        // 2. Contains this link
        // 3. Doesn't contain other post links (to avoid getting a container of multiple items)
        const content = container.textContent.trim();
        const hasContent = content.length > 50 && content.length < 2000; // Not too small, not too big
        const otherPostLinks = container.querySelectorAll('a[href*="/post/"]').length;
        const isGoodContainer = hasContent && otherPostLinks === 1; // Only contains this one post link
        
        console.log(`  Checking container ${container.tagName}.${container.className}: content=${content.length}chars, postLinks=${otherPostLinks}, good=${isGoodContainer}`);
        
        if (isGoodContainer) {
          bestContainer = container;
          break;
        }
      }
      
      // Add the best container we found for this post
      if (bestContainer && !foundItems.includes(bestContainer)) {
        foundItems.push(bestContainer);
        console.log(`✅ Added news item ${foundItems.length}:`, bestContainer.tagName, bestContainer.className, bestContainer.textContent.trim().substring(0, 60));
      }
    });
    
    console.log(`Found ${foundItems.length} news item containers`);
    
    if (foundItems.length > 0) {
      newsItems = foundItems;
    } else {
      console.log('❌ No post links found, trying fallback...');
      // Fallback: look for any elements with substantial content
      newsItems = Array.from(newsSection.querySelectorAll('*')).filter(el => {
        const hasContent = el.textContent.trim().length > 100;
        const hasLink = el.querySelector('a');
        const notTooNested = el.querySelectorAll('*').length < 20; // Not too complex
        return hasContent && hasLink && notTooNested;
      }).slice(0, 10); // Limit to 10 items
    }
    
    console.log(`Final result: ${newsItems.length} items to work with`);
    
    if (newsItems.length === 0) {
      console.log('❌ No news items found with any method');
      console.log('🔍 Check the HTML structure above');
      return;
    }
    
    // Get the position of each news item
    const itemPositions = newsItems.map(item => item.offsetTop);
    console.log('Item positions:', itemPositions);
    
    // Also log what content each item has
    newsItems.forEach((item, i) => {
      console.log(`Item ${i} content:`, item.textContent.trim().substring(0, 100));
    });
    
    let currentItemIndex = 0;
    
    function scrollToItem(itemIndex) {
      const position = itemPositions[itemIndex] || 0;
      const firstChild = newsSection.firstElementChild;
      if (firstChild) {
        firstChild.style.transform = `translateY(-${position}px)`;
        console.log(`Scrolled to item ${itemIndex}, position: -${position}px`);
        console.log(`Showing content: ${newsItems[itemIndex].textContent.trim().substring(0, 80)}...`);
      }
      currentItemIndex = itemIndex;
    }
    
    // Initialize by showing the first item
    scrollToItem(0);
    
    function nextItem() {
      const next = (currentItemIndex + 1) % newsItems.length;
      scrollToItem(next);
    }
    
    function prevItem() {
      const prev = (currentItemIndex - 1 + newsItems.length) % newsItems.length;
      scrollToItem(prev);
    }
    
    // Add simple navigation buttons
    const nextBtn = document.createElement('button');
    nextBtn.innerHTML = '▼';
    nextBtn.className = 'simple-nav simple-next';
    nextBtn.onclick = nextItem;
    
    const prevBtn = document.createElement('button');
    prevBtn.innerHTML = '▲';
    prevBtn.className = 'simple-nav simple-prev';
    prevBtn.onclick = prevItem;
    
    newsSection.appendChild(nextBtn);
    newsSection.appendChild(prevBtn);
    
    console.log('Simple carousel ready!');
    
  }, 1000);
});
</script>
