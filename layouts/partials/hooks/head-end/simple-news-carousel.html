{{/* Single-Item Rotating News Carousel */}}
<style>
/* Target the news section specifically */
section[id="news"] {
  position: relative;
  overflow: hidden;
  padding: 20px;
  min-height: 150px;
}

/* Only hide items when carousel is initialized */
section[id="news"].carousel-initialized > div > *:not(.news-active),
section[id="news"].carousel-initialized .grid > *:not(.news-active),
section[id="news"].carousel-initialized [class*="grid"] > *:not(.news-active) {
  display: none;
  opacity: 0;
  transition: opacity 0.5s ease-in-out;
}

/* Show only the active news item when carousel is active */
section[id="news"].carousel-initialized .news-active {
  display: block !important;
  opacity: 1 !important;
}

/* Style the active news item */
section[id="news"] .news-active {
  padding: 25px;
  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border-left: 4px solid #0066cc;
  transition: all 0.3s ease;
  max-width: 800px;
  margin: 0 auto;
}

section[id="news"] .news-active:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

/* Style news content */
section[id="news"] .news-active h3,
section[id="news"] .news-active .article-title {
  font-size: 1.25rem;
  margin-bottom: 10px;
  color: #333;
  line-height: 1.4;
}

section[id="news"] .news-active .article-metadata,
section[id="news"] .news-active .news-date {
  font-size: 0.875rem;
  color: #666;
  margin-bottom: 8px;
  font-weight: 500;
}

section[id="news"] .news-active .article-summary,
section[id="news"] .news-active p {
  font-size: 0.95rem;
  color: #555;
  line-height: 1.6;
  margin: 0;
}

section[id="news"] .news-active a {
  color: #0066cc;
  text-decoration: none;
  transition: color 0.3s ease;
}

section[id="news"] .news-active a:hover {
  color: #004499;
  text-decoration: underline;
}

/* Navigation arrows */
.news-nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  font-size: 1.25rem;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}

section[id="news"]:hover .news-nav-btn {
  opacity: 0.8;
}

.news-nav-btn:hover {
  opacity: 1 !important;
  background: rgba(0,0,0,0.8);
  transform: translateY(-50%) scale(1.1);
}

.news-nav-prev {
  left: 15px;
}

.news-nav-next {
  right: 15px;
}

/* Progress indicator */
.news-progress {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.news-progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(0,0,0,0.3);
  cursor: pointer;
  transition: all 0.3s ease;
}

.news-progress-dot.active {
  background: #0066cc;
  transform: scale(1.2);
}

.news-progress-dot:hover {
  background: #0066cc;
  opacity: 0.7;
}

/* Dark mode support */
.dark section[id="news"] .news-active {
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
  border-left-color: #4da6ff;
}

.dark section[id="news"] .news-active h3,
.dark section[id="news"] .news-active .article-title {
  color: #e0e0e0;
}

.dark section[id="news"] .news-active .article-metadata,
.dark section[id="news"] .news-active .news-date {
  color: #999;
}

.dark section[id="news"] .news-active .article-summary,
.dark section[id="news"] .news-active p {
  color: #ccc;
}

.dark section[id="news"] .news-active a {
  color: #4da6ff;
}

.dark section[id="news"] .news-active a:hover {
  color: #66b3ff;
}

/* Mobile responsive */
@media (max-width: 768px) {
  section[id="news"] {
    padding: 15px;
  }
  
  section[id="news"] .news-active {
    padding: 20px;
  }
  
  .news-nav-btn {
    width: 28px;
    height: 28px;
    font-size: 1rem;
  }
  
  .news-nav-prev {
    left: 10px;
  }
  
  .news-nav-next {
    right: 10px;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Wait for Hugo Blox to render content
  setTimeout(function() {
    const newsSection = document.querySelector('section[id="news"]');
    if (!newsSection) {
      console.log('No news section found');
      return;
    }
    
    // Find the container with news items - try multiple selectors
    let container = newsSection.querySelector('.grid, [class*="grid"]');
    if (!container) {
      // Try other common Hugo Blox selectors
      container = newsSection.querySelector('.flex, [class*="flex"], .collection-content, .posts, .articles');
    }
    if (!container) {
      console.log('No container found, using newsSection directly');
      container = newsSection;
    }
    
    // Debug: Let's see the exact structure
    console.log('=== NEWS SECTION DEBUG ===');
    console.log('News section:', newsSection);
    console.log('Container:', container);
    console.log('Container tag:', container.tagName);
    console.log('Container classes:', container.className);
    console.log('Container children count:', container.children.length);
    
    // Log each child with details
    Array.from(container.children).forEach((child, index) => {
      console.log(`Child ${index}:`, {
        tag: child.tagName,
        classes: child.className,
        textLength: child.textContent.trim().length,
        textPreview: child.textContent.trim().substring(0, 100),
        childrenCount: child.children.length,
        element: child
      });
    });
    
    // Try Hugo Blox specific patterns first
    let items = [];
    
    // Pattern 1: Look for date-title-summary structure
    const dateElements = container.querySelectorAll('[class*="date"], .article-metadata, time');
    if (dateElements.length > 0) {
      console.log('Found date elements, looking for their parent containers');
      dateElements.forEach(dateEl => {
        // Find the parent that contains the full article
        let parent = dateEl.parentElement;
        while (parent && parent !== container) {
          const hasTitle = parent.querySelector('h1, h2, h3, h4, .title, [class*="title"]');
          const hasContent = parent.textContent.trim().length > 100;
          if (hasTitle && hasContent && !items.includes(parent)) {
            items.push(parent);
            break;
          }
          parent = parent.parentElement;
        }
      });
    }
    
    // Pattern 2: Look for title elements and find their containers
    if (items.length === 0) {
      const titleElements = container.querySelectorAll('h1, h2, h3, h4, .title, [class*="title"]');
      console.log('Found title elements:', titleElements.length);
      titleElements.forEach(titleEl => {
        let parent = titleEl.parentElement;
        while (parent && parent !== container) {
          const hasContent = parent.textContent.trim().length > 50;
          const hasSiblings = parent.children.length > 1;
          if (hasContent && hasSiblings && !items.includes(parent)) {
            items.push(parent);
            break;
          }
          parent = parent.parentElement;
        }
      });
    }
    
    // Pattern 3: Look for link elements (article titles are often links)
    if (items.length === 0) {
      const linkElements = container.querySelectorAll('a[href*="/post/"], a[href*="/blog/"], a[href*="/news/"]');
      console.log('Found post links:', linkElements.length);
      linkElements.forEach(linkEl => {
        let parent = linkEl.parentElement;
        while (parent && parent !== container) {
          const hasContent = parent.textContent.trim().length > 50;
          if (hasContent && !items.includes(parent)) {
            items.push(parent);
            break;
          }
          parent = parent.parentElement;
        }
      });
    }
    
    // Pattern 4: Direct children with substantial content
    if (items.length === 0) {
      console.log('Trying direct children approach');
      items = Array.from(container.children).filter(child => {
        const textContent = child.textContent.trim();
        const hasContent = textContent.length > 30;
        const hasMultipleElements = child.children.length > 0;
        
        console.log(`Child analysis:`, {
          tag: child.tagName,
          hasContent,
          hasMultipleElements,
          textLength: textContent.length,
          childrenCount: child.children.length
        });
        
        return hasContent && hasMultipleElements;
      });
    }
    
    console.log(`Final items found: ${items.length}`);
    if (items.length === 0) {
      console.log('No suitable items found - carousel will not activate');
      return; // Exit gracefully without hiding anything
    }
    
    console.log(`Found ${items.length} news items, setting up single-item carousel`);
    console.log('Items found:', items);
    items.forEach((item, index) => {
      console.log(`Item ${index}:`, item.tagName, item.className, item.textContent.substring(0, 100));
    });
    
    let currentIndex = 0;
    let autoRotateInterval;
    
    // Function to show specific item
    function showItem(index) {
      // Remove active class from all items
      items.forEach(item => item.classList.remove('news-active'));
      
      // Add active class to current item
      if (items[index]) {
        items[index].classList.add('news-active');
      }
      
      // Update progress dots
      updateProgressDots();
    }
    
    // Function to go to next item
    function nextItem() {
      currentIndex = (currentIndex + 1) % items.length;
      showItem(currentIndex);
    }
    
    // Function to go to previous item
    function prevItem() {
      currentIndex = (currentIndex - 1 + items.length) % items.length;
      showItem(currentIndex);
    }
    
    // Add navigation buttons
    const prevBtn = document.createElement('button');
    prevBtn.className = 'news-nav-btn news-nav-prev';
    prevBtn.innerHTML = '‹';
    prevBtn.onclick = () => {
      stopAutoRotate();
      prevItem();
      startAutoRotate();
    };
    
    const nextBtn = document.createElement('button');
    nextBtn.className = 'news-nav-btn news-nav-next';
    nextBtn.innerHTML = '›';
    nextBtn.onclick = () => {
      stopAutoRotate();
      nextItem();
      startAutoRotate();
    };
    
    newsSection.appendChild(prevBtn);
    newsSection.appendChild(nextBtn);
    
    // Add progress indicator
    const progressContainer = document.createElement('div');
    progressContainer.className = 'news-progress';
    
    function createProgressDots() {
      progressContainer.innerHTML = '';
      items.forEach((item, index) => {
        const dot = document.createElement('div');
        dot.className = 'news-progress-dot';
        dot.onclick = () => {
          stopAutoRotate();
          currentIndex = index;
          showItem(currentIndex);
          startAutoRotate();
        };
        progressContainer.appendChild(dot);
      });
    }
    
    function updateProgressDots() {
      const dots = progressContainer.querySelectorAll('.news-progress-dot');
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }
    
    createProgressDots();
    newsSection.appendChild(progressContainer);
    
    // Auto-rotate functionality
    function startAutoRotate() {
      if (items.length > 1) {
        autoRotateInterval = setInterval(nextItem, 4000); // 4 seconds per item
      }
    }
    
    function stopAutoRotate() {
      if (autoRotateInterval) {
        clearInterval(autoRotateInterval);
      }
    }
    
    // Pause auto-rotate on hover
    newsSection.addEventListener('mouseenter', stopAutoRotate);
    newsSection.addEventListener('mouseleave', startAutoRotate);
    
    // Mark section as initialized (this triggers the CSS hiding)
    newsSection.classList.add('carousel-initialized');
    
    // Initialize - show first item and start auto-rotate
    showItem(0);
    startAutoRotate();
    
  }, 1000); // Wait 1 second for content to load
});
</script>
