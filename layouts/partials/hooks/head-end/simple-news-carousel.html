{{/* SIMPLE SHOW/HIDE APPROACH */}}
<style>
section[id="news"] {
  position: relative;
  border: 2px solid green;
  padding: 20px;
  margin: 20px 0;
  height: 250px; /* Fixed height */
  overflow: hidden; /* Hide content that doesn't fit */
}

section[id="news"]::before {
  content: "SINGLE ITEM DISPLAY";
  display: block;
  background: lightgreen;
  padding: 5px;
  font-size: 12px;
}

/* Hide all articles by default when carousel is active */
section[id="news"].carousel-active article {
  display: none;
}

/* Show only the current article with constrained sizing */
section[id="news"].carousel-active article.current-item {
  display: block;
  max-height: 200px; /* Constrain article height */
  overflow: hidden; /* Hide overflow content */
}

/* Make sure text doesn't get cut off awkwardly */
section[id="news"].carousel-active article.current-item p {
  display: -webkit-box;
  -webkit-line-clamp: 3; /* Limit to 3 lines */
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Simple navigation buttons */
.nav-btn {
  position: absolute;
  top: 10px;
  background: #0066cc;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  z-index: 100;
}

.nav-prev {
  right: 80px;
}

.nav-next {
  right: 10px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('=== SIMPLE SHOW/HIDE APPROACH ===');
    
    const newsSection = document.querySelector('section[id="news"]');
    if (!newsSection) {
      console.log('No news section found');
      return;
    }
    
    // Find all article elements (these are the complete news items)
    const articles = newsSection.querySelectorAll('article');
    console.log(`Found ${articles.length} article elements`);
    
    if (articles.length === 0) {
      console.log('No articles found');
      return;
    }
    
    // Log what we found
    articles.forEach((article, i) => {
      const title = article.querySelector('h2, h1, .title');
      const titleText = title ? title.textContent.trim().substring(0, 50) : 'No title';
      console.log(`Article ${i}: ${titleText}...`);
    });
    
    let currentIndex = 0;
    
    function showArticle(index) {
      // Remove current-item class from all articles
      articles.forEach(article => article.classList.remove('current-item'));
      
      // Add current-item class to the selected article
      if (articles[index]) {
        articles[index].classList.add('current-item');
        const title = articles[index].querySelector('h2, h1, .title');
        const titleText = title ? title.textContent.trim().substring(0, 50) : 'No title';
        console.log(`Showing article ${index}: ${titleText}...`);
      }
      
      currentIndex = index;
    }
    
    function nextArticle() {
      const next = (currentIndex + 1) % articles.length;
      showArticle(next);
    }
    
    function prevArticle() {
      const prev = (currentIndex - 1 + articles.length) % articles.length;
      showArticle(prev);
    }
    
    // Add navigation buttons
    const nextBtn = document.createElement('button');
    nextBtn.textContent = 'Next';
    nextBtn.className = 'nav-btn nav-next';
    nextBtn.onclick = nextArticle;
    
    const prevBtn = document.createElement('button');
    prevBtn.textContent = 'Previous';
    prevBtn.className = 'nav-btn nav-prev';
    prevBtn.onclick = prevArticle;
    
    newsSection.appendChild(nextBtn);
    newsSection.appendChild(prevBtn);
    
    // Activate the carousel
    newsSection.classList.add('carousel-active');
    
    // Show the first article
    showArticle(0);
    
    console.log('✅ Simple carousel ready!');
    console.log(`📰 Showing 1 of ${articles.length} articles`);
    
  }, 1000);
});
</script>
