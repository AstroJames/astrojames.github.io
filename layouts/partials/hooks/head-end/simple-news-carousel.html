{{/* NEW SIMPLE APPROACH: Just scroll the entire content */}}
<style>
section[id="news"] {
  position: relative;
  overflow: hidden;
  height: 200px; /* Fixed height to show one item */
  border: 2px solid blue; /* Debug border */
}

section[id="news"]::before {
  content: "SIMPLE CAROUSEL";
  display: block;
  background: lightblue;
  padding: 5px;
  font-size: 12px;
}

/* Make the content scrollable */
section[id="news"] > div {
  transition: transform 0.5s ease;
}

/* Simple navigation buttons */
.simple-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  z-index: 100;
}

.simple-prev {
  left: 10px;
}

.simple-next {
  right: 10px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    console.log('=== STEP 1: SHOW ONLY FIRST NEWS ITEM ===');
    
    const newsSection = document.querySelector('section[id="news"]');
    if (!newsSection) {
      console.log('❌ No news section found');
      return;
    }
    
    console.log('✅ Found news section');
    
    // Find all possible containers and their children
    const possibleContainers = newsSection.querySelectorAll('div, article, section');
    console.log(`Found ${possibleContainers.length} possible containers`);
    
    // Look for containers with multiple direct children (likely news items)
    let targetContainer = null;
    let newsItems = [];
    
    possibleContainers.forEach((container, i) => {
      const children = Array.from(container.children);
      if (children.length > 1) {
        console.log(`Container ${i} has ${children.length} children:`, container);
        children.forEach((child, j) => {
          console.log(`  Child ${j}:`, {
            tag: child.tagName,
            classes: child.className,
            textLength: child.textContent.trim().length,
            textPreview: child.textContent.trim().substring(0, 50) + '...'
          });
        });
        
        // If this looks like news items (children have some content)
        const hasSubstantialContent = children.some(child => child.textContent.trim().length > 20);
        if (hasSubstantialContent && !targetContainer) {
          targetContainer = container;
          newsItems = children;
          console.log('📰 Selected this as news items container');
        }
      }
    });
    
    if (!targetContainer || newsItems.length === 0) {
      console.log('❌ Could not find news items container with main logic');
      console.log('🔄 Trying fallback: using all direct children of news section');
      
      // Fallback: try all direct children of news section that have some content
      const directChildren = Array.from(newsSection.children).filter(child => {
        const hasContent = child.textContent.trim().length > 10;
        const notButton = !child.textContent.includes('Next') && !child.textContent.includes('Previous');
        const notDebug = !child.textContent.includes('DEBUG');
        return hasContent && notButton && notDebug;
      });
      
      if (directChildren.length > 0) {
        console.log(`📰 Fallback found ${directChildren.length} potential items`);
        targetContainer = newsSection;
        newsItems = directChildren;
      } else {
        console.log('❌ Even fallback failed - leaving items in original state');
        return;
      }
    }
    
    console.log(`✅ Found ${newsItems.length} news items`);
    
    let currentIndex = 0;
    
    // Function to show specific item
    function showItem(index) {
      console.log(`📍 Switching to item ${index}`);
      
      newsItems.forEach((item, i) => {
        if (i === index) {
          console.log(`✅ Showing item ${i}`);
          item.classList.add('carousel-item-visible');
        } else {
          console.log(`🙈 Hiding item ${i}`);
          item.classList.remove('carousel-item-visible');
        }
      });
      
      currentIndex = index;
    }
    
    // Function to go to next item
    function nextItem() {
      const nextIndex = (currentIndex + 1) % newsItems.length;
      console.log(`➡️ Next: from ${currentIndex} to ${nextIndex}`);
      showItem(nextIndex);
    }
    
    // Function to go to previous item
    function prevItem() {
      const prevIndex = (currentIndex - 1 + newsItems.length) % newsItems.length;
      console.log(`⬅️ Previous: from ${currentIndex} to ${prevIndex}`);
      showItem(prevIndex);
    }
    
    // Add navigation buttons
    const nextBtn = document.createElement('button');
    nextBtn.textContent = 'Next →';
    nextBtn.style.cssText = `
      position: absolute;
      top: 10px;
      right: 10px;
      background: #0066cc;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      z-index: 100;
    `;
    nextBtn.onclick = nextItem;
    
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '← Previous';
    prevBtn.style.cssText = `
      position: absolute;
      top: 10px;
      right: 100px;
      background: #666;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      z-index: 100;
    `;
    prevBtn.onclick = prevItem;
    
    // Add buttons to news section
    newsSection.style.position = 'relative';
    newsSection.appendChild(nextBtn);
    newsSection.appendChild(prevBtn);
    
    // Initialize - show first item
    showItem(0);
    
    // Mark carousel as ready (this triggers CSS hiding of other items)
    newsSection.classList.add('carousel-ready');
    
    console.log('🎉 Step 2 complete: Navigation buttons added');
    console.log('🔥 Click "Next →" or "← Previous" to test navigation');
    
  }, 2000);
});
</script>
