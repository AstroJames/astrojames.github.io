{{/* Horizontal Scrolling Background Animation */}}
<style>
/* Force animation on any element with background image */
[style*="background-image"],
section[style*="background-image"] {
  background-size: auto 120% !important; /* Reduced zoom from 150% to 120% */
  background-repeat: repeat-x !important;
  animation: scroll-horizontal 60s linear infinite !important;
}
/* Apply horizontal scrolling animation to the biography section background */
.resume-biography-3,
section[data-block="resume-biography-3"],
section.dark,
.dark,
body.dark section:first-child,
.landing-page section:first-child {
  background-size: auto 120% !important; /* Reduced zoom from 150% to 120% */
  background-repeat: repeat-x !important; /* Repeat horizontally */
  background-position: 0 center !important;
  animation: scroll-horizontal 60s linear infinite !important; /* 60 second loop */
}

/* Keyframe animation for horizontal scrolling */
@keyframes scroll-horizontal {
  0% {
    background-position: 0% center;
  }
  100% {
    background-position: -100% center; /* Move one full image width to the left */
  }
}

/* Pause animation on hover (optional) */
.resume-biography-3:hover,
section[data-block="resume-biography-3"]:hover,
section.dark:hover,
.dark:hover,
body.dark section:first-child:hover,
.landing-page section:first-child:hover {
  animation-play-state: paused;
}

/* Ensure smooth animation on all devices */
@media (prefers-reduced-motion: reduce) {
  .resume-biography-3,
  section[data-block="resume-biography-3"],
  section.dark {
    animation: none !important;
    background-position: 0 center !important;
  }
}

/* Alternative slower speed for mobile */
@media (max-width: 768px) {
  .resume-biography-3,
  section[data-block="resume-biography-3"],
  section.dark {
    animation-duration: 90s; /* Slower on mobile for better performance */
  }
}
</style>
