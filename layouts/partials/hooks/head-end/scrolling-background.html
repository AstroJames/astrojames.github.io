{{/* Animate only the biography's image layer, using a composited transform. */}}
<style>
#section-resume-biography-3 { overflow: hidden; }
#section-resume-biography-3 > .home-section-bg.bg-image {
  right: auto;
  width: calc(100% + 2000px);
  background-size: 2000px 120% !important;
  background-repeat: repeat-x !important;
  background-position: left center !important;
  filter: none !important;
  will-change: transform;
  animation: biography-pan 45s linear infinite;
}
@keyframes biography-pan {
  from { transform: translate3d(-2000px, 0, 0); }
  to { transform: translate3d(0, 0, 0); }
}
@media (max-width: 768px) {
  #section-resume-biography-3 > .home-section-bg.bg-image { animation-duration: 60s; }
}
@media (prefers-reduced-motion: reduce) {
  #section-resume-biography-3 > .home-section-bg.bg-image {
    animation: none;
    transform: none;
    will-change: auto;
  }
}
</style>
