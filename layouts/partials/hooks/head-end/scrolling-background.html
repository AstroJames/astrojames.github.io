{{/* Animate only the biography's image layer, using a composited transform. */}}
<style>
#section-resume-biography-3 { overflow: hidden; }
#section-resume-biography-3 > .home-section-bg.bg-image {
  right: auto;
  --biography-tile-width: 2000px;
  width: calc(100% + var(--biography-tile-width));
  background-size: var(--biography-tile-width) auto !important;
  background-repeat: repeat-x !important;
  background-position: left center !important;
  filter: none !important;
  will-change: transform;
  animation: biography-pan 45s linear infinite;
}
@keyframes biography-pan {
  from { transform: translate3d(calc(-1 * var(--biography-tile-width)), 0, 0); }
  to { transform: translate3d(0, 0, 0); }
}
@media (max-width: 768px) {
  #section-resume-biography-3 > .home-section-bg.bg-image { animation-duration: 60s; }
}
@media (prefers-reduced-motion: reduce) {
  #section-resume-biography-3 > .home-section-bg.bg-image {
    animation: none;
    transform: none;
    will-change: auto;
  }
}
</style>
{{ $image := resources.Get "media/KHI.webp" }}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const layer = document.querySelector('#section-resume-biography-3 > .home-section-bg.bg-image');
  if (!layer) return;

  // Keep the image's intrinsic ratio. Only enlarge uniformly when the section
  // needs more height; the section clips the excess image at either side.
  const imageRatio = {{ $image.Width }} / {{ $image.Height }};
  let tileWidth = 2000;
  new ResizeObserver(([entry]) => {
    const nextWidth = Math.max(2000, Math.ceil(entry.contentRect.height * imageRatio));
    if (nextWidth === tileWidth) return;
    tileWidth = nextWidth;
    layer.style.setProperty('--biography-tile-width', `${tileWidth}px`);
  }).observe(layer);
});
</script>
