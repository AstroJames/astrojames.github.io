{{/* Magnetic Field Lines Between Sections */}}
<style>
#magnetic-field-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.magnetic-line {
  stroke: rgba(255, 0, 0, 0.3);
  stroke-width: 1.5;
  fill: none;
  opacity: 0;
  transition: opacity 0.5s ease;
  filter: drop-shadow(0 0 3px rgba(255, 0, 0, 0.5));
}

.magnetic-line.visible {
  opacity: 1;
}

.magnetic-line.strong {
  stroke: rgba(255, 0, 0, 0.6);
  stroke-width: 2;
  filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.7));
}

/* Animated flowing effect */
.magnetic-line {
  stroke-dasharray: 5, 10;
  animation: flow 3s linear infinite;
}

@keyframes flow {
  0% {
    stroke-dashoffset: 0;
  }
  100% {
    stroke-dashoffset: 15;
  }
}
</style>

<svg id="magnetic-field-container">
  <!-- Magnetic field lines will be generated here -->
</svg>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const svg = document.getElementById('magnetic-field-container');
  const fieldLines = [];
  
  // Get main sections
  function getSections() {
    return document.querySelectorAll('section, .resume-biography-3, #featured, #news, #collabs');
  }
  
  // Create curved path between two points
  function createCurvedPath(x1, y1, x2, y2, curvature = 0.3) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    // Control points for the curve
    const cp1x = x1 + dx * 0.3 + dy * curvature;
    const cp1y = y1 + dy * 0.3 - dx * curvature;
    const cp2x = x2 - dx * 0.3 + dy * curvature;
    const cp2y = y2 - dy * 0.3 - dx * curvature;
    
    return `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`;
  }
  
  // Create field lines
  function createFieldLines() {
    // Clear existing lines
    svg.innerHTML = '';
    fieldLines.length = 0;
    
    const sections = getSections();
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Create lines between consecutive sections
    for (let i = 0; i < sections.length - 1; i++) {
      const section1 = sections[i];
      const section2 = sections[i + 1];
      
      const rect1 = section1.getBoundingClientRect();
      const rect2 = section2.getBoundingClientRect();
      
      // Create multiple field lines per section pair
      for (let j = 0; j < 3; j++) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.classList.add('magnetic-line');
        
        // Start points from right edge of first section
        const x1 = windowWidth * 0.9 + j * 20;
        const y1 = rect1.bottom - rect1.height * (0.3 + j * 0.2);
        
        // End points to left edge of next section
        const x2 = windowWidth * 0.1 - j * 20;
        const y2 = rect2.top + rect2.height * (0.3 + j * 0.2);
        
        // Create curved path with varying curvature
        const curvature = (j - 1) * 0.2; // -0.2, 0, 0.2
        const pathData = createCurvedPath(x1, y1, x2, y2, curvature);
        
        path.setAttribute('d', pathData);
        
        // Make middle line stronger
        if (j === 1) {
          path.classList.add('strong');
        }
        
        svg.appendChild(path);
        fieldLines.push({
          element: path,
          section1: section1,
          section2: section2
        });
      }
    }
  }
  
  // Update field line visibility based on scroll
  function updateFieldLines() {
    const scrollY = window.scrollY;
    const windowHeight = window.innerHeight;
    
    fieldLines.forEach(line => {
      const rect1 = line.section1.getBoundingClientRect();
      const rect2 = line.section2.getBoundingClientRect();
      
      // Show line if both sections are near viewport
      const section1Visible = rect1.bottom > -100 && rect1.top < windowHeight + 100;
      const section2Visible = rect2.bottom > -100 && rect2.top < windowHeight + 100;
      
      if (section1Visible && section2Visible) {
        line.element.classList.add('visible');
      } else {
        line.element.classList.remove('visible');
      }
    });
  }
  
  // Initialize
  createFieldLines();
  updateFieldLines();
  
  // Update on scroll and resize
  let scrollTimeout;
  window.addEventListener('scroll', function() {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(updateFieldLines, 10);
  });
  
  window.addEventListener('resize', function() {
    createFieldLines();
    updateFieldLines();
  });
});
</script>
