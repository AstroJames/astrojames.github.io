{{/* Magnetic Field Lines Around Header Name */}}
<style>
#header-field-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 998; /* Behind particles but above background */
  overflow: hidden;
}

.header-field-line {
  stroke: rgba(255, 0, 0, 0.4);
  stroke-width: 1.5;
  fill: none;
  filter: drop-shadow(0 0 3px rgba(255, 0, 0, 0.5));
}

/* Animated flowing effect */
.header-field-line {
  stroke-dasharray: 8, 12;
  animation: field-flow 4s linear infinite;
}

@keyframes field-flow {
  0% {
    stroke-dashoffset: 0;
  }
  100% {
    stroke-dashoffset: 20;
  }
}

/* Make header position relative to contain the absolute SVG */
header, .navbar {
  position: relative;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const header = document.querySelector('header') || document.querySelector('.navbar');
  
  if (!header) return;
  
  // Create SVG container
  const svgContainer = document.createElement('div');
  svgContainer.id = 'header-field-container';
  
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.width = '100%';
  svg.style.height = '100%';
  
  // Create complex magnetic field line path inspired by plasma physics
  function createFieldLinePath(y, direction = 1, amplitude = 20, fieldIndex = 0) {
    const width = window.innerWidth;
    const segments = 8; // Number of curve segments for complexity
    let path = `M 0 ${y}`;
    
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const x = t * width;
      
      // Multiple harmonic components for complex structure
      const wave1 = Math.sin(t * Math.PI * 2) * amplitude * 0.4; // Primary wave
      const wave2 = Math.sin(t * Math.PI * 4 + fieldIndex) * amplitude * 0.2; // Secondary harmonics
      const wave3 = Math.sin(t * Math.PI * 8 + fieldIndex * 2) * amplitude * 0.1; // Tertiary structure
      
      // Magnetic mirror-like structure (field lines closer at ends)
      const mirrorEffect = Math.sin(t * Math.PI) * amplitude * 0.3;
      
      // Combine all wave components
      const totalOffset = (wave1 + wave2 + wave3 + mirrorEffect) * direction;
      const yPos = y + totalOffset;
      
      if (i === 0) {
        path += ` L ${x} ${yPos}`;
      } else {
        // Create smooth curves between points
        const prevT = (i - 1) / segments;
        const prevX = prevT * width;
        const controlDistance = (x - prevX) * 0.3;
        
        path += ` Q ${prevX + controlDistance} ${yPos} ${x} ${yPos}`;
      }
    }
    
    return path;
  }
  
  function createFieldLines() {
    // Clear existing lines
    svg.innerHTML = '';
    
    const headerHeight = header.offsetHeight;
    const centerY = headerHeight / 2;
    
    // Line above the text
    const topLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    topLine.classList.add('header-field-line');
    topLine.setAttribute('d', createFieldLinePath(centerY - 15, -1, 15, 0));
    svg.appendChild(topLine);
    
    // Line below the text
    const bottomLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    bottomLine.classList.add('header-field-line');
    bottomLine.setAttribute('d', createFieldLinePath(centerY + 15, 1, 15, 1));
    svg.appendChild(bottomLine);
  }
  
  // Add SVG to body (not just header) for full-site coverage
  svgContainer.appendChild(svg);
  document.body.appendChild(svgContainer);
  
  // Initialize
  createFieldLines();
  
  // Update on resize
  window.addEventListener('resize', createFieldLines);
});
</script>
