{{/* Magnetic Field Lines Around Header Name */}}
<style>
#header-field-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 998; /* Behind particles but above background */
  overflow: hidden;
}

.header-field-line {
  stroke: rgba(255, 255, 255, 0.8);
  stroke-width: 0.5;
  fill: none;
}

@keyframes field-flow {
  0% {
    stroke-dashoffset: 0;
  }
  100% {
    stroke-dashoffset: 20;
  }
}

/* Make header position relative to contain the absolute SVG */
header, .navbar {
  position: relative;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const header = document.querySelector('header') || document.querySelector('.navbar');
  
  if (!header) return;
  
  // Create SVG container
  const svgContainer = document.createElement('div');
  svgContainer.id = 'header-field-container';
  
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.width = '100%';
  svg.style.height = '100%';
  
  // Create magnetic field line path (straight or curved toward name)
  function createFieldLinePath(y, direction = 1, amplitude = 20, fieldIndex = 0, isDistorted = false, nameX = 0, nameY = 0) {
    const width = window.innerWidth;
    
    if (!isDistorted) {
      // Simple straight line from left to right
      return `M 0 ${y} L ${width} ${y}`;
    }
    
    // Curved field line bending toward the name (gravitational lensing effect)
    const segments = 20;
    const segmentWidth = width / segments;
    let path = `M 0 ${y}`;
    
    for (let i = 1; i <= segments; i++) {
      const x = i * segmentWidth;
      const distanceToName = Math.sqrt((x - nameX) * (x - nameX) + (y - nameY) * (y - nameY));
      const maxDistance = Math.sqrt(width * width + 100 * 100); // Reference distance
      
      // Calculate curvature - stronger when closer to name
      const curvatureStrength = Math.max(0, 1 - (distanceToName / (maxDistance * 0.3)));
      const pullTowardName = curvatureStrength * 30; // Max 30px deflection
      
      // Calculate deflection toward name position
      const deflectionY = (nameY - y) * (pullTowardName / Math.abs(nameY - y || 1));
      const curvedY = y + deflectionY;
      
      if (i === 1) {
        path += ` Q ${x/2} ${curvedY} ${x} ${curvedY}`;
      } else {
        const prevX = (i - 1) * segmentWidth;
        const controlX = (prevX + x) / 2;
        path += ` T ${x} ${curvedY}`;
      }
    }
    
    return path;
  }
  
  // Track hover state and name position
  let isNameHovered = false;
  let namePosition = { x: 0, y: 0 };
  
  // Expose field line state to other scripts
  window.magneticFieldState = {
    isDistorted: false,
    nameX: 0,
    nameY: 0,
    getFieldLineY: function(x, baseY) {
      if (!this.isDistorted) return baseY;
      
      const distanceToName = Math.sqrt((x - this.nameX) * (x - this.nameX) + (baseY - this.nameY) * (baseY - this.nameY));
      const maxDistance = Math.sqrt(window.innerWidth * window.innerWidth + 100 * 100);
      const curvatureStrength = Math.max(0, 1 - (distanceToName / (maxDistance * 0.3)));
      const pullTowardName = curvatureStrength * 30;
      const deflectionY = (this.nameY - baseY) * (pullTowardName / Math.abs(this.nameY - baseY || 1));
      
      return baseY + deflectionY;
    }
  };
  
  function createFieldLines(distorted = false, nameX = 0, nameY = 0) {
    // Clear existing lines
    svg.innerHTML = '';
    
    const headerHeight = header.offsetHeight;
    const centerY = headerHeight / 2;
    
    // Line above the text - halfway between top boundary and text
    const topLineY = (0 + (centerY - 15)) / 2; // Halfway between top (0) and text top
    const topLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    topLine.classList.add('header-field-line');
    topLine.style.transition = 'd 0.3s ease-out';
    topLine.setAttribute('d', createFieldLinePath(topLineY, -1, 15, 0, distorted, nameX, nameY));
    svg.appendChild(topLine);
    
    // Line below the text - halfway between text and bottom boundary  
    const bottomLineY = ((centerY + 15) + headerHeight) / 2; // Halfway between text bottom and header bottom
    const bottomLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    bottomLine.classList.add('header-field-line');
    bottomLine.style.transition = 'd 0.3s ease-out';
    bottomLine.setAttribute('d', createFieldLinePath(bottomLineY, 1, 15, 1, distorted, nameX, nameY));
    svg.appendChild(bottomLine);
  }
  
  // Add SVG to body (not just header) for full-site coverage
  svgContainer.appendChild(svg);
  document.body.appendChild(svgContainer);
  
  // Get all header buttons/links for hover detection
  const headerButtons = header.querySelectorAll('.nav-link, .navbar-nav a, .btn, button');
  
  // Add hover listeners to header buttons for field line distortion
  headerButtons.forEach(button => {
    button.addEventListener('mouseenter', function() {
      const rect = button.getBoundingClientRect();
      const buttonCenterX = rect.left + rect.width / 2;
      const buttonCenterY = rect.top + rect.height / 2;
      
      // Distortion when hovering buttons
      window.magneticFieldState.isDistorted = true;
      window.magneticFieldState.nameX = buttonCenterX;
      window.magneticFieldState.nameY = buttonCenterY;
      
      createFieldLines(true, buttonCenterX, buttonCenterY);
    });
    
    button.addEventListener('mouseleave', function() {
      // Return to straight field lines when leaving button
      window.magneticFieldState.isDistorted = false;
      window.magneticFieldState.nameX = 0;
      window.magneticFieldState.nameY = 0;
      
      createFieldLines(false, 0, 0);
    });
  });
  
  // Initialize
  createFieldLines();
  
  // Update on resize
  window.addEventListener('resize', function() {
    createFieldLines(isNameHovered, namePosition.x, namePosition.y);
  });
});
</script>
