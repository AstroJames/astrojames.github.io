{{/* Magnetic Field Lines Around Header Name */}}
<style>
#header-field-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 998; /* Behind particles but above background */
  overflow: hidden;
}

.header-field-line {
  stroke: rgba(255, 255, 255, 0.8);
  stroke-width: 0.5;
  fill: none;
}


@keyframes field-flow {
  0% {
    stroke-dashoffset: 0;
  }
  100% {
    stroke-dashoffset: 20;
  }
}

/* Make header position relative to contain the absolute SVG */
header, .navbar {
  position: relative;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const header = document.querySelector('header') || document.querySelector('.navbar');
  
  if (!header) return;
  
  // Create SVG container
  const svgContainer = document.createElement('div');
  svgContainer.id = 'header-field-container';
  
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.width = '100%';
  svg.style.height = '100%';
  
  // Create magnetic field line path (straight or curved toward name)
  function createFieldLinePath(y, direction = 1, amplitude = 20, fieldIndex = 0, isDistorted = false, nameX = 0, nameY = 0, relaxationProgress = 0) {
    const width = window.innerWidth;
    
    if (!isDistorted) {
      // Simple straight line from left to right
      return `M 0 ${y} L ${width} ${y}`;
    }
    
    // Curved field line bending toward the name (gravitational lensing effect)
    const segments = 20;
    const segmentWidth = width / segments;
    let path = `M 0 ${y}`;
    
    // Calculate distortion multiplier for relaxation
    const distortionMultiplier = window.magneticFieldState.isRelaxing ? 
      (1 - window.magneticFieldState.relaxationProgress) : 1;
    
    for (let i = 1; i <= segments; i++) {
      const x = i * segmentWidth;
      const distanceToName = Math.sqrt((x - nameX) * (x - nameX) + (y - nameY) * (y - nameY));
      const maxDistance = Math.sqrt(width * width + 100 * 100); // Reference distance
      
      // Calculate curvature - stronger when closer to name
      const curvatureStrength = Math.max(0, 1 - (distanceToName / (maxDistance * 0.5)));
      const pullTowardName = curvatureStrength * 8 * distortionMultiplier; // Apply relaxation multiplier
      
      // Calculate deflection toward name position
      const deflectionY = (nameY - y) * (pullTowardName / Math.abs(nameY - y || 1));
      const curvedY = y + deflectionY;
      
      if (i === 1) {
        path += ` Q ${x/2} ${curvedY} ${x} ${curvedY}`;
      } else {
        const prevX = (i - 1) * segmentWidth;
        const controlX = (prevX + x) / 2;
        path += ` T ${x} ${curvedY}`;
      }
    }
    
    return path;
  }
  
  // Track hover state and name position
  let isNameHovered = false;
  let namePosition = { x: 0, y: 0 };
  let relaxationAnimationId = null;
  let relaxationStartTime = null;
  let relaxationStartState = { nameX: 0, nameY: 0 };
  
  // Expose field line state to other scripts
  window.magneticFieldState = {
    isDistorted: false,
    nameX: 0,
    nameY: 0,
    waveActive: false,
    wavePosition: 0,
    isRelaxing: false,
    relaxationProgress: 0,
    getFieldLineY: function(x, baseY) {
      // First check for wave distortion
      if (this.waveActive) {
        const headerHeight = header ? header.offsetHeight : 80;
        const centerY = headerHeight / 2;
        const topLineY = (0 + (centerY - 15)) / 2;
        const bottomLineY = ((centerY + 15) + headerHeight) / 2;
        
        // Determine which field line and direction
        const isTopLine = Math.abs(baseY - topLineY) < Math.abs(baseY - bottomLineY);
        const direction = isTopLine ? -1 : 1;
        
        // Only apply wave if particle is near the wave position
        if (x <= this.wavePosition + 75 && x >= this.wavePosition - 75) {
          const distanceFromWave = x - this.wavePosition;
          // Gaussian envelope for smooth decay on both sides
          const waveInfluence = Math.exp(-(distanceFromWave * distanceFromWave) / (2 * 25 * 25));
          const waveAmplitude = waveInfluence * 3 * Math.sin(distanceFromWave * 0.2);
          
          return baseY + waveAmplitude * direction;
        }
        
        return baseY;
      }
      
      // Then check for button hover distortion or relaxation
      if (!this.isDistorted && !this.isRelaxing) return baseY;
      
      // Calculate distortion strength based on relaxation progress
      let effectiveNameX = this.nameX;
      let effectiveNameY = this.nameY;
      let distortionMultiplier = 1;
      
      if (this.isRelaxing) {
        // During relaxation, gradually reduce the distortion effect
        distortionMultiplier = 1 - this.relaxationProgress;
        effectiveNameX = this.nameX;
        effectiveNameY = this.nameY;
      }
      
      const distanceToName = Math.sqrt((x - effectiveNameX) * (x - effectiveNameX) + (baseY - effectiveNameY) * (baseY - effectiveNameY));
      const maxDistance = Math.sqrt(window.innerWidth * window.innerWidth + 100 * 100);
      const curvatureStrength = Math.max(0, 1 - (distanceToName / (maxDistance * 0.5)));
      const pullTowardName = curvatureStrength * 8 * distortionMultiplier;
      const deflectionY = (effectiveNameY - baseY) * (pullTowardName / Math.abs(effectiveNameY - baseY || 1));
      
      return baseY + deflectionY;
    }
  };
  
  function createFieldLines(distorted = false, nameX = 0, nameY = 0, relaxationProgress = 0) {
    // Clear existing lines
    svg.innerHTML = '';
    
    const headerHeight = header.offsetHeight;
    const centerY = headerHeight / 2;
    
    // If relaxing, interpolate between distorted and straight
    let effectiveDistorted = distorted;
    let effectiveNameX = nameX;
    let effectiveNameY = nameY;
    
    if (window.magneticFieldState.isRelaxing && relaxationProgress > 0) {
      effectiveDistorted = true; // Still use curved calculation
      effectiveNameX = nameX;
      effectiveNameY = nameY;
    }
    
    // Line above the text - halfway between top boundary and text
    const topLineY = (0 + (centerY - 15)) / 2;
    const topLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    topLine.classList.add('header-field-line');
    topLine.setAttribute('d', createFieldLinePath(topLineY, -1, 15, 0, effectiveDistorted, effectiveNameX, effectiveNameY, relaxationProgress));
    svg.appendChild(topLine);
    
    // Line below the text - halfway between text and bottom boundary  
    const bottomLineY = ((centerY + 15) + headerHeight) / 2;
    const bottomLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    bottomLine.classList.add('header-field-line');
    bottomLine.setAttribute('d', createFieldLinePath(bottomLineY, 1, 15, 1, effectiveDistorted, effectiveNameX, effectiveNameY, relaxationProgress));
    svg.appendChild(bottomLine);
  }
  
  // Add SVG to body (not just header) for full-site coverage
  svgContainer.appendChild(svg);
  document.body.appendChild(svgContainer);
  
  // Get all header buttons/links for hover detection
  const headerButtons = header.querySelectorAll('.nav-link, .navbar-nav a, .btn, button');
  const nameElement = document.querySelector('.navbar-brand') || document.querySelector('header h1') || document.querySelector('.site-title');
  
  // Wave distortion animation variables
  let waveAnimationId = null;
  let waveStartTime = null;
  
  // Function to create wave-distorted field line path
  function createWaveFieldLinePath(y, direction = 1, amplitude = 20, fieldIndex = 0, wavePosition = 0) {
    const width = window.innerWidth;
    const segments = 50;
    const segmentWidth = width / segments;
    let path = `M 0 ${y}`;
    
    for (let i = 1; i <= segments; i++) {
      const x = i * segmentWidth;
      
      // Only show wave if it has reached this position
      let waveY = y;
      if (x <= wavePosition + 75 && x >= wavePosition - 75) { // Only within 3 sigma of wave center
        const distanceFromWave = x - wavePosition;
        // Gaussian envelope for smooth decay on both sides
        const waveInfluence = Math.exp(-(distanceFromWave * distanceFromWave) / (2 * 25 * 25)); // Gaussian with sigma=25px
        const waveAmplitude = waveInfluence * 3 * Math.sin(distanceFromWave * 0.2); // Wave packet with Gaussian envelope
        
        waveY = y + waveAmplitude * direction;
      }
      
      if (i === 1) {
        path += ` Q ${x/2} ${waveY} ${x} ${waveY}`;
      } else {
        path += ` T ${x} ${waveY}`;
      }
    }
    
    return path;
  }
  
  // Animate wave distortion
  function animateWave(nameX) {
    waveStartTime = Date.now();
    
    function updateWave() {
      const elapsed = Date.now() - waveStartTime;
      const waveSpeed = 0.5; // pixels per millisecond
      const wavePosition = nameX + (elapsed * waveSpeed);
      
      // Update global state for particles
      window.magneticFieldState.waveActive = true;
      window.magneticFieldState.wavePosition = wavePosition;
      
      // Stop animation when wave reaches edge
      if (wavePosition > window.innerWidth + 200) {
        waveAnimationId = null;
        window.magneticFieldState.waveActive = false;
        window.magneticFieldState.wavePosition = 0;
        createFieldLines(false, 0, 0); // Return to normal
        return;
      }
      
      // Clear and recreate field lines with wave distortion
      svg.innerHTML = '';
      
      const headerHeight = header.offsetHeight;
      const centerY = headerHeight / 2;
      
      // Top line with wave
      const topLineY = (0 + (centerY - 15)) / 2;
      const topLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      topLine.classList.add('header-field-line');
      topLine.setAttribute('d', createWaveFieldLinePath(topLineY, -1, 15, 0, wavePosition));
      svg.appendChild(topLine);
      
      // Bottom line with wave
      const bottomLineY = ((centerY + 15) + headerHeight) / 2;
      const bottomLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      bottomLine.classList.add('header-field-line');
      bottomLine.setAttribute('d', createWaveFieldLinePath(bottomLineY, 1, 15, 1, wavePosition));
      svg.appendChild(bottomLine);
      
      waveAnimationId = requestAnimationFrame(updateWave);
    }
    
    updateWave();
  }
  
  // Animate relaxation back to straight field lines
  function animateRelaxation(fromNameX, fromNameY) {
    relaxationStartTime = Date.now();
    relaxationStartState = { nameX: fromNameX, nameY: fromNameY };
    
    function updateRelaxation() {
      const elapsed = Date.now() - relaxationStartTime;
      const relaxationDuration = 667; // 0.67 second relaxation (50% faster)
      const progress = Math.min(elapsed / relaxationDuration, 1);
      
      // Use easeOut cubic for natural relaxation
      const easedProgress = 1 - Math.pow(1 - progress, 3);
      
      // Update global state for particles
      window.magneticFieldState.isRelaxing = true;
      window.magneticFieldState.relaxationProgress = easedProgress;
      window.magneticFieldState.nameX = relaxationStartState.nameX;
      window.magneticFieldState.nameY = relaxationStartState.nameY;
      
      // Update field lines
      createFieldLines(true, relaxationStartState.nameX, relaxationStartState.nameY, easedProgress);
      
      // Continue animation or finish
      if (progress < 1) {
        relaxationAnimationId = requestAnimationFrame(updateRelaxation);
      } else {
        // Relaxation complete
        relaxationAnimationId = null;
        window.magneticFieldState.isRelaxing = false;
        window.magneticFieldState.relaxationProgress = 0;
        window.magneticFieldState.isDistorted = false;
        window.magneticFieldState.nameX = 0;
        window.magneticFieldState.nameY = 0;
        createFieldLines(false, 0, 0); // Final straight lines
      }
    }
    
    updateRelaxation();
  }
  
  // Add hover listener to name element for wave effect
  if (nameElement) {
    nameElement.addEventListener('mouseenter', function() {
      const rect = nameElement.getBoundingClientRect();
      const nameX = rect.left + rect.width / 2;
      
      // Cancel any existing wave animation
      if (waveAnimationId) {
        cancelAnimationFrame(waveAnimationId);
      }
      
      // Start wave animation
      animateWave(nameX);
    });
  }
  
  // Add hover listeners to header buttons for field line distortion
  headerButtons.forEach(button => {
    button.addEventListener('mouseenter', function() {
      // Cancel any existing relaxation animation when entering a new button
      if (relaxationAnimationId) {
        cancelAnimationFrame(relaxationAnimationId);
        relaxationAnimationId = null;
      }
      
      const rect = button.getBoundingClientRect();
      const buttonCenterX = rect.left + rect.width / 2;
      const buttonCenterY = rect.top + rect.height / 2;
      
      // Distortion when hovering buttons
      window.magneticFieldState.isDistorted = true;
      window.magneticFieldState.isRelaxing = false;
      window.magneticFieldState.relaxationProgress = 0;
      window.magneticFieldState.nameX = buttonCenterX;
      window.magneticFieldState.nameY = buttonCenterY;
      
      createFieldLines(true, buttonCenterX, buttonCenterY);
    });
    
    button.addEventListener('mouseleave', function() {
      // Cancel any existing relaxation animation
      if (relaxationAnimationId) {
        cancelAnimationFrame(relaxationAnimationId);
        relaxationAnimationId = null;
      }
      
      // Start relaxation animation from current position
      const currentNameX = window.magneticFieldState.nameX;
      const currentNameY = window.magneticFieldState.nameY;
      
      animateRelaxation(currentNameX, currentNameY);
    });
  });
  
  // Initialize
  createFieldLines();
  
  // Update on resize
  window.addEventListener('resize', function() {
    createFieldLines(isNameHovered, namePosition.x, namePosition.y);
  });
});
</script>
