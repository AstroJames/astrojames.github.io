  - id: week-02
    slot: Session 2
    date: "2026-10-14"
    speaker: David Velasco-Romero
    speaker_url: https://www.ias.edu/scholars/david-velasco-romero
    affiliation: Institute for Advanced Study
    title: "Limiting only where it fails: an a-posteriori fallback for high-order hydrodynamics and MHD in AthenaK."
    format: Research talk and discussion
    status: confirmed
    abstract: Standard shock-capturing schemes limit the reconstruction everywhere, before knowing whether limiting is needed, and pay for robustness with dissipation in smooth flow. This talk presents an a-posteriori alternative implemented in AthenaK, following the MOOD (Multi-dimensional Optimal Order Detection) approach. The method covers Newtonian and relativistic hydrodynamics and MHD, with the fallback applied consistently to fluxes and electric fields so that constrained transport preserves ∇·B = 0.
